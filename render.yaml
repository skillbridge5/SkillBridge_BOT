services:
  - type: web
    name: skillbridge-bot
    runtime: node
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: skillbridge.db
      - key: PORT
        value: 10000
